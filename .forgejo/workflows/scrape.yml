name: Scrape latest data

# No schedule: lichess's games-by-user endpoint has returned 404 for every
# player since mid-2026 (lichess-org/api#667, closed unfixed), so a four-hourly
# run would only ever fail -- on a runner with capacity 1, in front of
# everything else queued behind it.
on:
  workflow_dispatch:

env:
  NIX_CONFIG: "accept-flake-config = true"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: native
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build database
        run: nix develop -c ./run.sh build

      - name: Publish database
        # publish-db is a runner command whose destination is services.dbs.
        run: publish-db chess chess.db

      - name: Commit database
        run: ./run.sh commit-db
